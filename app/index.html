<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sunset Panels — Cover Maker</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
<h1>Sunset Panels</h1>
<p class="tagline">Build a three-panel sunset cover, right in your browser — no uploads needed.</p>
</header>
<main>
<canvas id="cover" width="1200" height="800"></canvas>
<section class="controls">
<div class="row">
<label>Panel 1
<select id="panel1">
<option value="boulevard">Boulevard</option>
<option value="pier">Pier</option>
</select>
</label>
<label>Panel 2
<select id="panel2">
<option value="boulevard">Boulevard</option>
<option value="pier" selected>Pier</option>
</select>
</label>
<label>Panel 3
<select id="panel3">
<option value="boulevard">Boulevard</option>
<option value="pier">Pier</option>
</select>
</label>
</div>
<div class="row">
<label class="title-label">Title
<input id="title" type="text" value="SUNSET PANELS" maxlength="24">
</label>
</div>
<div class="row presets">
<span>Presets:</span>
<button type="button" data-shot="1">Shot 1</button>
<button type="button" data-shot="2">Shot 2</button>
<button type="button" data-shot="3">Shot 3</button>
</div>
<div class="row">
<button id="download" type="button">Download JPEG</button>
</div>
<p class="note">Works fully offline — no uploads, no tracking, all artwork is generated locally.</p>
</section>
</main>
<script type="module" src="src/main.js"></script>
</body>
</html>

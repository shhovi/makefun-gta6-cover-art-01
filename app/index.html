<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sunset Panels</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>Sunset Panels</h1>
  <p>Turn three photos into a synthwave three-panel cover — everything stays in your browser, nothing is uploaded.</p>
</header>
<main>
  <section class="panels">
    <div class="panel" data-panel="0">
      <label for="file-0">Panel 1</label>
      <input id="file-0" type="file" accept="image/*">
      <div class="preview" id="preview-0"><span>No image yet</span></div>
    </div>
    <div class="panel" data-panel="1">
      <label for="file-1">Panel 2</label>
      <input id="file-1" type="file" accept="image/*">
      <div class="preview" id="preview-1"><span>No image yet</span></div>
    </div>
    <div class="panel" data-panel="2">
      <label for="file-2">Panel 3</label>
      <input id="file-2" type="file" accept="image/*">
      <div class="preview" id="preview-2"><span>No image yet</span></div>
    </div>
  </section>
  <section class="controls">
    <label for="title-input">Title</label>
    <input id="title-input" type="text" placeholder="SUNSET PANELS" value="SUNSET PANELS" maxlength="40">
    <label for="subtitle-input">Subtitle</label>
    <input id="subtitle-input" type="text" placeholder="a synthwave story" maxlength="60">
    <button id="download-btn" type="button">Download PNG</button>
  </section>
  <section class="output">
    <canvas id="cover-canvas" width="1200" height="675" hidden></canvas>
    <img id="rendered" alt="Rendered cover preview">
  </section>
</main>
<footer><small>Sunset Panels — built for make.fun gta6-cover-art-01 · MIT licensed</small></footer>
<script type="module" src="src/main.js"></script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sunset Panels — Cover Art Maker</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<main class="app">
  <aside class="controls">
    <h1>Sunset Panels</h1>
    <p class="tagline">A photo and a caption become a three-panel poster cover — all on your machine, never uploaded.</p>

    <label class="field">
      <span>Main photo</span>
      <input id="photo" type="file" accept="image/*">
    </label>
    <div class="row">
      <button type="button" data-sample="pier">Sample: Pier</button>
      <button type="button" data-sample="boulevard">Sample: Boulevard</button>
    </div>
    <label class="field">
      <span>Second photo (small panels, optional)</span>
      <input id="photo2" type="file" accept="image/*">
    </label>

    <label class="field">
      <span>Caption</span>
      <input id="caption" type="text" maxlength="40" value="Sunset Heist">
    </label>

    <div class="field">
      <span>Colour grade</span>
      <div id="grades" class="row wrap"></div>
    </div>

    <div class="field">
      <span>Panel to adjust</span>
      <div id="panels" class="row wrap"></div>
    </div>
    <label class="field">
      <span>Zoom</span>
      <input id="zoom" type="range" min="1" max="3" step="0.01" value="1">
    </label>
    <p class="hint">Drag the preview to pan. Click a panel to select it.</p>

    <label class="field">
      <span>Export size</span>
      <select id="size"></select>
    </label>
    <button id="export" type="button" class="primary">Export PNG</button>
    <p id="status" role="status"></p>
  </aside>

  <section class="stage">
    <canvas id="preview" width="1080" height="1080" aria-label="Cover preview"></canvas>
  </section>
</main>
<script type="module" src="./src/main.js"></script>
</body>
</html>
